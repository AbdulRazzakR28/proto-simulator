<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MQTT Decoder — Login</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0f14;
    --surface: #13161d;
    --surface2: #1a1e28;
    --border: rgba(255,255,255,0.08);
    --accent: #00d4a0;
    --accent-dim: rgba(0,212,160,0.12);
    --text: #e8eaf0;
    --muted: #6b7280;
    --error: #f87171;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Inter', sans-serif;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* Subtle grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,212,160,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,212,160,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 2.5rem 2.5rem;
    width: 100%;
    max-width: 380px;
    position: relative;
    z-index: 1;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 2rem;
  }

  .logo-icon {
    width: 36px;
    height: 36px;
    background: var(--accent-dim);
    border: 1px solid rgba(0,212,160,0.3);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .logo-icon svg { width: 18px; height: 18px; }

  .logo-text {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  .logo-sub {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    margin-top: 1px;
  }

  h1 {
    font-size: 20px;
    font-weight: 500;
    margin-bottom: 6px;
    color: var(--text);
  }

  .subtitle {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 1.75rem;
  }

  .field { margin-bottom: 1rem; }

  label {
    display: block;
    font-size: 12px;
    font-weight: 500;
    color: var(--muted);
    margin-bottom: 6px;
    font-family: var(--mono);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  input[type="password"] {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 14px;
    padding: 10px 14px;
    outline: none;
    transition: border-color 0.15s;
  }

  input[type="password"]:focus {
    border-color: var(--accent);
  }

  input[type="password"]::placeholder { color: var(--muted); }

  .btn {
    width: 100%;
    background: var(--accent);
    color: #0d0f14;
    border: none;
    border-radius: 6px;
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 600;
    padding: 11px;
    cursor: pointer;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-top: 1.25rem;
    transition: opacity 0.15s;
  }

  .btn:hover { opacity: 0.88; }
  .btn:active { opacity: 0.75; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .error-msg {
    background: rgba(248,113,113,0.1);
    border: 1px solid rgba(248,113,113,0.3);
    border-radius: 6px;
    color: var(--error);
    font-size: 13px;
    padding: 10px 14px;
    margin-top: 1rem;
    display: none;
    font-family: var(--mono);
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: var(--accent-dim);
    border: 1px solid rgba(0,212,160,0.2);
    border-radius: 20px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--accent);
    padding: 3px 10px;
    margin-bottom: 1.5rem;
  }

  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-icon">
      <svg viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M2 5h14M2 9h10M2 13h7" stroke="#00d4a0" stroke-width="1.5" stroke-linecap="round"/>
        <circle cx="14" cy="13" r="2.5" stroke="#00d4a0" stroke-width="1.5"/>
        <path d="M14 10.5V7" stroke="#00d4a0" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </div>
    <div>
      <div class="logo-text">MQTT Decoder</div>
      <div class="logo-sub">Internal Tool</div>
    </div>
  </div>

  <div class="badge">
    <span class="dot"></span>
    Internal access only
  </div>

  <h1>Sign in</h1>
  <p class="subtitle">Enter the access password to continue.</p>

  <div class="field">
    <label>Password</label>
    <input type="password" id="pw" placeholder="••••••••••••" autofocus />
  </div>

  <button class="btn" id="loginBtn" onclick="doLogin()">Authenticate</button>
  <div class="error-msg" id="errMsg">Incorrect password. Try again.</div>
</div>

<script>
  document.getElementById('pw').addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });

  async function doLogin() {
    const pw = document.getElementById('pw').value;
    const btn = document.getElementById('loginBtn');
    const err = document.getElementById('errMsg');
    if (!pw) return;

    btn.disabled = true;
    btn.textContent = 'Verifying…';
    err.style.display = 'none';

    const fd = new FormData();
    fd.append('password', pw);
    const res = await fetch('/login', { method: 'POST', body: fd });
    const data = await res.json();

    if (data.ok) {
      window.location.href = '/';
    } else {
      err.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Authenticate';
      document.getElementById('pw').value = '';
      document.getElementById('pw').focus();
    }
  }
</script>
</body>
</html>
